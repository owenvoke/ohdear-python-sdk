name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    name: Check style formatting
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Hatch
        run: python3 -m pip install hatch

      # Runs the Ruff version pinned in pyproject.toml, annotating PRs inline.
      - name: Style Check
        run: hatch run lint
        env:
          RUFF_OUTPUT_FORMAT: github

  tests:
    runs-on: ubuntu-latest
    name: Tests
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Hatch
        run: python3 -m pip install hatch

      - name: Run tests
        run: hatch run test
